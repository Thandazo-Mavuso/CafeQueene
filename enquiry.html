<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Café Queene | Enquiry</title>
</head>

<body>

    <header>
        <h1>Café Queene</h1>

        <nav>
            <a href="index.html">Home</a> |
            <a href="about.html">About Us</a> |
            <a href="menu.html">Menu</a> |
            <a href="enquiry.html">Enquiry</a> |
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>

        <h2>Make an Enquiry</h2>

        <p>
            Have a question or would you like to book a table?
            Complete the form below and we will get back to you.
        </p>

        <form>

            <label for="name">Full Name:</label><br>
            <input type="text" id="name" name="name" required>
            <br><br>

            <label for="email">Email Address:</label><br>
            <input type="email" id="email" name="email" required>
            <br><br>

            <label for="phone">Phone Number:</label><br>
            <input type="tel" id="phone" name="phone" required>
            <br><br>

            <label for="branch">Choose Branch:</label><br>
            <select id="branch" name="branch">
                <option value="middelburg">Middelburg</option>
                <option value="nelspruit">Nelspruit</option>
            </select>
            <br><br>

            <label for="enquiry">Type of Enquiry:</label><br>
            <select id="enquiry" name="enquiry">
                <option value="general">General Enquiry</option>
                <option value="booking">Table Booking</option>
                <option value="feedback">Feedback</option>
            </select>
            <br><br>

            <label for="date">Booking Date:</label><br>
            <input type="date" id="date" name="date">
            <br><br>

            <label for="guests">Number of Guests:</label><br>
            <input type="number" id="guests" name="guests" min="1">
            <br><br>

            <label for="message">Message:</label><br>
            <textarea id="message" name="message" rows="6" cols="40"></textarea>
            <br><br>

            <button type="submit">Submit Enquiry</button>

        </form>

    </main>

    <footer>
        <p>&copy; 2026 Café Queene. All Rights Reserved.</p>
        <p>Instagram: @cafequeene</p>
    </footer>

</body>
</html>
